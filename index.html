<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inazuma Squad Rogue</title>
    <style>
        body {
            background-color: #0b112c;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 10px;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .top-bar {
            background-color: #11224d;
            border: 2px solid #3b5998;
            padding: 10px;
            font-weight: bold;
            font-size: 20px;
            color: #f1c40f;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .secret-trigger { cursor: pointer; -webkit-tap-highlight-color: transparent; }

        .btn {
            background: linear-gradient(#1e3799, #0c2461);
            border: 2px solid #4a69bd;
            color: #fff;
            padding: 12px 18px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin: 4px;
        }
        .btn:active { background: #0c2461; }

        #creator-zone {
            display: none;
            background-color: rgba(241, 196, 15, 0.1);
            border: 2px dashed #f1c40f;
            padding: 12px;
            margin: 10px auto;
            border-radius: 6px;
            max-width: 450px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 450px;
            margin: 0 auto 20px auto;
        }

        .card {
            background-color: #070b1e;
            border: 2px solid #1c2d5a;
            padding: 6px 4px;
            opacity: 0.15;
            transition: all 0.2s ease;
        }
        
        .card.unlocked { opacity: 1; border: 2px solid #f1c40f; }

        .avatar { font-size: 32px; padding: 8px 0; margin-bottom: 4px; border: 1px solid #000; background-color: #f39c12; }
        .card.wind .avatar { background-color: #2980b9; }
        .card.wood .avatar { background-color: #27ae60; }
        .card.mountain .avatar { background-color: #d35400; }

        .name { font-size: 12px; font-weight: bold; margin-bottom: 2px; text-shadow: 1px 1px #000; }
        .rarity-box { background-color: #f39c12; color: #000; font-size: 9px; font-weight: bold; margin: 2px auto; width: fit-content; padding: 1px 3px; }
        .stats-box { background-color: #11224d; border: 1px solid #1c2d5a; font-size: 10px; padding: 2px; display: flex; justify-content: space-between; }
        .rating-num { color: #f1c40f; font-weight: bold; }

        /* Terrain de Match */
        .match-field {
            background-color: #1e272e;
            border: 2px solid #34495e;
            max-width: 450px;
            margin: 20px auto;
            padding: 15px;
            border-radius: 6px;
        }
        .match-log { background-color: #000; color: #2ecc71; padding: 10px; font-size: 11px; text-align: left; height: 100px; overflow-y: auto; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <span class="secret-trigger" onclick="secretTap()">◀</span>
        <span>Inazuma Squad Rogue</span>
        <span>⚡</span>
    </div>
    
    <div id="creator-zone">
        <button class="btn" style="background: linear-gradient(#f1c40f, #f39c12); color: #000;" onclick="unlockAllPlayers()">🔓 TOUT DÉBLOQUER (CRÉATEUR)</button>
    </div>

    <div style="margin-bottom: 15px;">
        <button class="btn" onclick="triggerGacha()">🎲 Recruter (Gacha)</button>
        <button class="btn" style="background: #c0392b;" onclick="resetGame()">🔄 Reset</button>
    </div>

    <!-- Grille des Joueurs -->
    <div class="grid" id="player-grid"></div>

    <!-- Mode Match de Foot -->
    <div class="match-field">
        <h3 style="margin: 0 0 10px 0; color: #f1c40f; font-size: 15px;">⚽ STAGE DE MATCH (5 vs 5)</h3>
        <button class="btn" style="background: #27ae60; width: 100%; font-size: 14px;" onclick="startMatch()">🔥 LANCER LE MATCH</button>
        <div class="match-log" id="match-log">Prêt pour le coup d'envoi... Débloquez au moins un joueur !</div>
    </div>

    <script>
        const FIRST_TIME_PASSWORD = "admin"; 

        const playersData = [
            { id: 1, name: "Axel", rating: 96, element: "Fire", icon: "🔥", type: "fire" },
            { id: 2, name: "Froste", rating: 97, element: "Wind", icon: "❄️", type: "wind" },
            { id: 3, name: "Gele", rating: 103, element: "Wind", icon: "🧟", type: "wind" },
            { id: 4, name: "Grengo", rating: 105, element: "Fire", icon: "🎃", type: "fire" },
            { id: 5, name: "Hatch", rating: 104, element: "Wood", icon: "🧟‍♂️", type: "wood" },
            { id: 6, name: "Jude Sharp", rating: 106, element: "Wind", icon: "👁️", type: "wind" },
            { id: 7, name: "Skipper", rating: 105, element: "Wood", icon: "🏴‍☠️", type: "wood" },
            { id: 8, name: "Nathan", rating: 97, element: "Wind", icon: "🏃", type: "wind" },
            { id: 9, name: "Mark", rating: 95, element: "Mount.", icon: "🧤", type: "mountain" }
        ];

        let unlockedPlayers = JSON.parse(localStorage.getItem('inazuma_unlocked')) || [];
        if (localStorage.getItem('is_creator_device') === 'true') {
            window.addEventListener('DOMContentLoaded', () => document.getElementById('creator-zone').style.display = 'block');
        }

        function renderGrid() {
            const grid = document.getElementById('player-grid');
            grid.innerHTML = "";
            playersData.forEach(player => {
                const isUnlocked = unlockedPlayers.includes(player.id);
                const card = document.createElement('div');
                card.className = `card ${isUnlocked ? 'unlocked' : ''} ${player.type}`;
                card.innerHTML = `
                    <div class="avatar">${player.icon}</div>
                    <div class="name">${player.name}</div>
                    <div class="rarity-box">Legendary</div>
                    <div class="stats-box"><span>PR <span class="rating-num">${player.rating}</span></span><span>${player.element}</span></div>
                `;
                grid.appendChild(card);
            });
        }

        function triggerGacha() {
            const locked = playersData.filter(p => !unlockedPlayers.includes(p.id));
            if (locked.length === 0) return;
            const lucky = locked[Math.floor(Math.random() * locked.length)];
            unlockedPlayers.push(lucky.id);
            localStorage.setItem('inazuma_unlocked', JSON.stringify(unlockedPlayers));
            renderGrid();
        }

        function unlockAllPlayers() {
            if (localStorage.getItem('is_creator_device') !== 'true') return;
            unlockedPlayers = playersData.map(p => p.id);
            localStorage.setItem('inazuma_unlocked', JSON.stringify(unlockedPlayers));
            renderGrid();
        }

        function resetGame() {
            unlockedPlayers = [];
            localStorage.removeItem('inazuma_unlocked');
            renderGrid();
            document.getElementById('match-log').innerText = "Données réinitialisées.";
        }

        /* VRAI MOTEUR DE MATCH SIMPLIFIÉ */
        function startMatch() {
            const log = document.getElementById('match-log');
            if (unlockedPlayers.length === 0) {
                log.innerText = "⚠️ Erreur: Recrute au moins un joueur via le Gacha avant de jouer !";
                return;
            }

            log.innerHTML = "⚽ Début du match !<br>";
            
            // Calcul de la puissance totale de ton équipe active
            let teamPower = 0;
            playersData.forEach(p => {
                if (unlockedPlayers.includes(p.id)) teamPower += p.rating;
            });

            // Puissance adverse aléatoire selon le niveau global (Simule le mode Roguelite)
            let enemyPower = Math.floor(Math.random() * 300) + 200;

            setTimeout(() => {
                log.innerHTML += `⚔️ Ta force : ${teamPower} vs Force adverse : ${enemyPower}<br>`;
                if (teamPower >= enemyPower) {
                    let vosButs = Math.floor(Math.random() * 3) + 1;
                    let leursButs = Math.floor(Math.random() * vosButs);
                    log.innerHTML += `🎉 VICTOIRE ! Score final : ${vosButs} - ${leursButs} ! Tu passes au Stage suivant.`;
                } else {
                    let leursButs = Math.floor(Math.random() * 3) + 1;
                    let vosButs = Math.floor(Math.random() * leursButs);
                    log.innerHTML += `❌ DÉFAITE ! Score final : ${vosButs} - ${leursButs}. Entraîne tes joueurs !`;
                }
            }, 800);
        }

        // Système Admin
        let tapCount = 0, lastTap = 0;
        function secretTap() {
            if (localStorage.getItem('is_creator_device') === 'true') return;
            const now = new Date().getTime();
            if (now - lastTap < 600) tapCount++; else tapCount = 1;
            lastTap = now;
            if (tapCount === 3) {
                tapCount = 0;
                if (prompt("Code Créateur :") === FIRST_TIME_PASSWORD) {
                    localStorage.setItem('is_creator_device', 'true');
                    document.getElementById('creator-zone').style.display = 'block';
                }
            }
        }

        renderGrid();
    </script>
</body>
</html>
